# ===== Environment =====
executor: slurm
use-conda: True
use-apptainer: True
apptainer-args: "--bind /scratch/alpine --bind /pl/active/Anschutz_BDC"
slurm-qos: "cpu-normal"
slurm-logdir: "results/logs"
slurm-keep-successful-logs: True

# ===== Default resources =====

default-resources:
    slurm_partition: "acpu"
    slurm_account:   "amc-general"
    runtime: 60
    mem: "4GB"

# ===== Rule-specific resources =====

set-resources:
    merge_fastqs:
        runtime: 10
        mem: "1GB"
    create_sample_csv:
        runtime: 10
        mem: "1GB"
    cellranger_count:
        runtime: 1440
        mem: "2GB"
    create_aggr_csv:
        runtime: 10
        mem: "1GB"
    run_aggr:
        runtime: 240
        mem: "5GB"
    copy_files:
        runtime: 30
        mem: "1GB"
    run_rscript:
        runtime: 60
        mem: "10GB"
    run_dropkick:
        runtime: 30
        mem: "200GB"
    run_scar:
        runtime: 60
        mem: "100GB"
    igblast_bcr:
        runtime: 60
        mem: "3GB"